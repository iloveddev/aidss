<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AID Installation | Authentication, Identity & Defense</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-soft: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --card-hover: #f1f5f9;
            --border: #e2e8f0;
            --border-focus: #6366f1;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --error: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            transition: background 0.3s;
        }
        .installer-card {
            background: var(--card-bg);
            padding: 56px 48px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1), 0 0 1px 0 rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 560px;
            border: 1px solid var(--border);
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .installer-card:hover {
            box-shadow: 0 35px 60px -12px rgba(0, 0, 0, 0.15);
            border-color: var(--border-focus);
        }
        .header {
            text-align: center;
            margin-bottom: 48px;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, var(--text-main) 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
        }
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            padding: 0 20px;
        }
        .step {
            flex: 1;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            position: relative;
            transition: color 0.2s;
        }
        .step.active {
            color: var(--primary);
        }
        .step::before {
            content: '';
            display: block;
            width: 28px;
            height: 28px;
            background: var(--border);
            border-radius: 50%;
            margin: 0 auto 8px;
            line-height: 28px;
            text-align: center;
            color: white;
            font-size: 11px;
            font-weight: 600;
            transition: background 0.2s, transform 0.2s;
        }
        .step.active::before {
            background: var(--primary);
            transform: scale(1.1);
        }
        .form-section {
            margin-bottom: 32px;
        }
        .form-section-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-main);
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: var(--card-hover);
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--border-focus);
            background: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08);
        }
        .form-group input::placeholder {
            color: var(--text-muted);
        }
        .form-group.input-db-password input {
            padding-right: 48px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 480px) {
            .form-row > div {
                grid-column: 1 / -1;
            }
        }
        .btn {
            width: 100%;
            padding: 14px 24px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-top: 8px;
        }
        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 24px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .alert-error {
            background: #fef3f3;
            color: var(--error);
            border: 1px solid #fca5a5;
        }
        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .footer-text {
            margin-top: 32px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }
        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .footer-text a:hover {
            opacity: 0.8;
        }
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            display: none;
            margin: 0 auto 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .success-check {
            width: 40px;
            height: 40px;
            border: 3px solid var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            animation: checkIn 0.5s ease;
        }
        @keyframes checkIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        .check-icon {
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="installer-card">
        <div class="header">
            <h1>AID Installation</h1>
            <p>Configure your identity & defense platform</p>
        </div>

        <div class="step-indicator">
            <div class="step active">1. Config</div>
            <div class="step">2. Create</div>
            <div class="step">3. Ready</div>
        </div>

        <div id="alert-box" class="alert"></div>

        <form id="install-form">
            <div class="form-section">
                <div class="form-section-label">Database Configuration</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Database Host</label>
                        <input type="text" name="db_host" value="localhost" required placeholder="localhost">
                    </div>
                    <div class="form-group">
                        <label>Database Name</label>
                        <input type="text" name="db_name" required placeholder="aid_platform">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Database User</label>
                        <input type="text" name="db_user" required placeholder="root">
                    </div>
                    <div class="form-group">
                        <label>Database Password</label>
                        <input type="password" name="db_pass" required placeholder="••••••••">
                    </div>
                </div>
            </div>

            <div class="form-section" style="margin-bottom: 32px;">
                <div class="form-section-label">Admin Account</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Admin Username</label>
                        <input type="text" name="admin_user" required placeholder="admin">
                    </div>
                    <div class="form-group">
                        <label>Admin Email</label>
                        <input type="email" name="admin_email" required placeholder="admin@yourdomain.com">
                    </div>
                </div>
                <div class="form-group">
                    <label>Admin Password</label>
                    <input type="password" name="admin_pass" required placeholder="••••••••••••••••">
                </div>
            </div>

            <button type="submit" class="btn" id="install-btn">
                <span id="spinner" class="loading-spinner"></span>
                <span id="btn-text">Complete Installation</span>
            </button>
        </form>

        <div class="footer-text">
            <p>After installation, <a href="#" id="delete-link">delete this folder</a> for security.</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('install-form');
        const alertBox = document.getElementById('alert-box');
        const installBtn = document.getElementById('install-btn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btn-text');
        const deleteLink = document.getElementById('delete-link');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            
            // Show loading state
            installBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.style.display = 'none';
            installBtn.style.cursor = 'not-allowed';

            try {
                const response = await fetch('process.php', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if (result.success) {
                    // Success animation
                    installBtn.innerHTML = `
                        <div class="success-check">
                            <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <path d="M20 6L9 17l-5-5"/>
                            </svg>
                        </div>
                    `;
                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = 'Installation successful! Platform is ready.';
                    alertBox.style.display = 'block';
                    
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.innerText = result.message || 'Installation failed. Check your database settings.';
                    alertBox.style.display = 'block';
                    
                    // Reset button
                    installBtn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.style.display = 'inline';
                    installBtn.style.cursor = 'pointer';
                }
            } catch (err) {
                alertBox.className = 'alert alert-error';
                alertBox.innerText = 'Network error. Please check your connection and try again.';
                alertBox.style.display = 'block';
                
                installBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.style.display = 'inline';
                installBtn.style.cursor = 'pointer';
            }
        };

        // Real-time validation
        const inputs = form.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                const parent = input.parentElement;
                const error = parent.querySelector('.error-message');
                if (error) {
                    error.remove();
                }
            });
        });
    </script>
</body>
</html>
